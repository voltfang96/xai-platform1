<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAI Platform - Explainable AI for Regulated Industries</title>

<!--
  Zero external dependencies, by design.

  This page previously loaded React, Babel and Tailwind from CDNs. That made the
  whole UI fail closed - a blank page - whenever the network was unavailable,
  which is the normal condition at a conference venue and in an air-gapped
  compliance environment. Everything below is now inline vanilla JS and CSS, so
  the app renders with the network cable pulled out.

  The only optional remote asset is the Noto font link. If it is blocked the
  browser falls back to system fonts and the page still reads correctly; no
  behaviour depends on it.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Noto+Sans+Bengali&family=Noto+Sans+Tamil&family=Noto+Sans+Telugu&family=Noto+Sans+Kannada&family=Noto+Sans+Malayalam&family=Noto+Sans+Gujarati&family=Noto+Sans+Gurmukhi&family=Noto+Sans+Oriya&family=Noto+Sans+Ol+Chiki&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">

<style>
/* ---------------------------------------------------------------- palette
   Institutional rather than consumer: a cool ink base, a single teal accent,
   and semantic colours reserved for meaning. Green, amber and red appear ONLY
   for compliance status and contribution direction, never as decoration, so
   that seeing red anywhere in the report always means the same thing.

   Contrast: body and heading text against --bg/--panel clears WCAG AA in both
   themes; the semantic --*-tx tones are the readable pair for their --*-bg.
*/
:root {
  --bg:#f4f6fa; --panel:#ffffff; --panel-2:#fbfcfe;
  --border:#dde4ee; --border-strong:#c3cddd;
  --text:#101a2b; --text-2:#33415c; --muted:#64748b;
  --accent:#0f766e; --accent-hi:#115e59; --accent-soft:#e6f4f2;
  --brand:#1e3a5f;
  --good-bg:#e9f9f1; --good-br:#9fdcc0; --good-tx:#0a5c3e; --good-bar:#0f9d6b;
  --warn-bg:#fdf6e7; --warn-br:#e8cd8e; --warn-tx:#7a5104; --warn-bar:#c98a05;
  --bad-bg:#fdeeef;  --bad-br:#eeb0b6;  --bad-tx:#8e1c28;  --bad-bar:#c8323f;
  --info-bg:#eaf2fb; --info-br:#b6cfea; --info-tx:#1c3f68;
  --sky-bg:#eef6fb;  --sky-br:#b3d4e8;  --sky-tx:#144e6b;
  --chip:#e6f4f2; --chip-tx:#0f766e; --track:#eceff5;
  --head:linear-gradient(135deg,#16283f 0%,#1e3a5f 45%,#0f5f5c 100%);
  --shadow:0 1px 2px rgba(16,26,43,.05),0 6px 20px rgba(16,26,43,.06);
  --shadow-lift:0 2px 4px rgba(16,26,43,.07),0 14px 32px rgba(16,26,43,.10);
  /* Regulator identity. Brand-adjacent, deliberately not the official marks. */
  --rbi:#1c4e80; --irdai:#8c2f39; --sebi:#0f5f5c; --indiaai:#a2570f;
}
html[data-theme="dark"] {
  --bg:#0a0f18; --panel:#111925; --panel-2:#161f2d;
  --border:#243040; --border-strong:#33445c;
  --text:#e8edf5; --text-2:#b9c5d6; --muted:#8b9bb0;
  --accent:#2dd4bf; --accent-hi:#14b8a6; --accent-soft:rgba(45,212,191,.12);
  --brand:#8ab4e8;
  --good-bg:rgba(15,157,107,.13); --good-br:rgba(15,157,107,.34); --good-tx:#6ee7b7; --good-bar:#10b981;
  --warn-bg:rgba(201,138,5,.14);  --warn-br:rgba(201,138,5,.36);  --warn-tx:#f0c674; --warn-bar:#d99a12;
  --bad-bg:rgba(200,50,63,.14);   --bad-br:rgba(200,50,63,.36);   --bad-tx:#f4a7ae; --bad-bar:#e05463;
  --info-bg:rgba(96,143,196,.13); --info-br:rgba(96,143,196,.32); --info-tx:#a8c6ea;
  --sky-bg:rgba(56,152,196,.12);  --sky-br:rgba(56,152,196,.30);  --sky-tx:#8ecbe8;
  --chip:rgba(45,212,191,.15); --chip-tx:#5eead4; --track:#1b2534;
  --head:linear-gradient(135deg,#080d15 0%,#132133 48%,#0c3a3a 100%);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55),0 16px 36px rgba(0,0,0,.45);
  --rbi:#5b9bd5; --irdai:#d98b95; --sebi:#4fd1c5; --indiaai:#e0a95f;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Malayalam","Noto Sans Gujarati","Noto Sans Gurmukhi","Noto Sans Oriya","Noto Sans Ol Chiki",sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
[lang="ur"],[lang="ks"]{font-family:"Noto Nastaliq Urdu",system-ui,serif;line-height:2.1}
[lang="sd"]{font-family:"Noto Nastaliq Urdu",system-ui,sans-serif;line-height:1.9}
[lang="sat"]{font-family:"Noto Sans Ol Chiki",system-ui,sans-serif}

.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{background:var(--head);color:#fff;box-shadow:var(--shadow)}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:24px 0}
h1{font-size:1.7rem;margin:0;font-weight:700}
.sub{color:#dbeafe;font-size:.87rem;margin:4px 0 0}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.2);border-radius:5px;padding:4px 8px;font-size:.72rem;font-weight:600}
.icon-btn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;padding:7px 11px;font-size:.95rem;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.28)}

main{padding:28px 0 8px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
h2.sec{font-size:1.06rem;margin:0 0 14px;font-weight:650}
h3.sub-h{font-size:.83rem;margin:18px 0 8px;font-weight:650}
.lbl{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px;font-weight:500}
.muted{color:var(--muted)}

.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g3,.g4,.g2{grid-template-columns:1fr}}

.dcard{text-align:start;background:var(--panel);border:2px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;font:inherit;color:inherit;transition:.18s}
.dcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.dcard[aria-pressed="true"]{border-color:var(--accent);background:var(--info-bg)}
.dcard .dtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dcard .dico{display:inline-flex}
.dcard .nm{font-weight:650;margin-top:10px;font-size:.98rem}
.dcard .rg{font-size:.74rem;color:var(--muted);margin-top:3px;line-height:1.35}
/* Regulator colour on the text, neutral tint behind it, so the label stays
   legible in both themes without needing a per-regulator background token. */
/* No `color` declared here on purpose: the .r-RBI / .r-IRDAI / .r-SEBI /
   .r-IndiaAI class on the same element supplies it. Setting color here would
   out-specify those and flatten every tag to body text colour. */
.dcard .tag{display:inline-block;margin-top:10px;border-radius:5px;padding:2px 8px;
  font-size:.7rem;font-weight:700;letter-spacing:.03em;
  background:var(--track);border:1px solid var(--border)}
.dcard[aria-pressed="true"]{box-shadow:var(--shadow-lift)}

input,select{width:100%;padding:8px 10px;font:inherit;font-size:.86rem;border-radius:8px;
  border:1px solid var(--border);background:var(--panel);color:var(--text)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn{border:0;border-radius:8px;padding:11px 22px;font:inherit;font-weight:600;color:#fff;background:var(--accent);cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){background:var(--accent-hi)}
.btn:disabled{background:var(--muted);cursor:not-allowed;opacity:.7}
.btn.v{background:var(--violet)} .btn.v:hover:not(:disabled){background:var(--violet-hi)}
.btn.ghost{background:var(--track);color:var(--text);padding:7px 13px;font-size:.82rem;font-weight:500}
.row-end{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:16px;margin-top:6px}
.row-end>*{flex:1 1 240px}
.center{display:flex;justify-content:center;margin:18px 0}

.box{border-radius:9px;border:1px solid var(--border);padding:11px;background:var(--track)}
.box .k{font-size:.71rem;opacity:.72}
.box .v{font-weight:700;margin-top:3px;word-break:break-word}
.tone-good{background:var(--good-bg);border-color:var(--good-br);color:var(--good-tx)}
.tone-warn{background:var(--warn-bg);border-color:var(--warn-br);color:var(--warn-tx)}
.tone-bad{background:var(--bad-bg);border-color:var(--bad-br);color:var(--bad-tx)}
.note{border-radius:9px;padding:13px;border:1px solid var(--info-br);background:var(--info-bg);color:var(--info-tx);margin-bottom:12px}
.note .k{font-size:.72rem;font-weight:600;margin-bottom:4px;opacity:.85}
.note .orig{font-size:.83rem;font-style:italic;opacity:.8;margin:7px 0 0}
.warnbar{border-radius:9px;padding:11px;font-size:.85rem;border:1px solid var(--warn-br);background:var(--warn-bg);color:var(--warn-tx)}
.errbar{border-radius:9px;padding:13px;font-size:.87rem;border:1px solid var(--bad-br);background:var(--bad-bg);color:var(--bad-tx);margin-bottom:16px}
.pill{border-radius:999px;padding:5px 13px;font-size:.83rem;font-weight:700;border:1px solid}

.bar-row{margin-bottom:14px}
.bar-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:5px}
.bar-name{font-size:.86rem;font-weight:500}
.bar-rank{color:var(--muted);margin-inline-end:5px}
.bar-val{font-size:.84rem;font-weight:700;font-variant-numeric:tabular-nums}
.bar-val.pos{color:var(--good-bar)} .bar-val.neg{color:var(--bad-bar)}
/* Flex `row` follows the writing direction, so the fill already starts at the
   right in RTL. An explicit row-reverse here would double-flip it and push the
   bar to the wrong edge. */
.track{height:10px;border-radius:999px;background:var(--track);overflow:hidden;display:flex}
.fill{height:100%;border-radius:999px;transition:width .5s ease}
.fill.pos{background:var(--good-bar)} .fill.neg{background:var(--bad-bar)}
.bar-exp{font-size:.76rem;color:var(--muted);margin:4px 0 0}

.check{border-radius:9px;padding:11px;border:1px solid}
.check .top{display:flex;gap:8px;align-items:center;font-size:.85rem;font-weight:600}
.check .st{margin-inline-start:auto;font-size:.72rem;opacity:.75;font-weight:500}
.check .crit{font-size:.75rem;opacity:.82;margin:5px 0 0;padding-inline-start:22px}
.check .find{font-size:.75rem;font-weight:600;margin:6px 0 0;padding-inline-start:22px;color:var(--warn-tx)}
.st-PASS{background:var(--good-bg);border-color:var(--good-br)}
.st-REVIEW{background:var(--warn-bg);border-color:var(--warn-br)}
.st-FAIL{background:var(--bad-bg);border-color:var(--bad-br)}
.req{border-radius:9px;padding:11px;border:1px solid var(--sky-br);background:var(--sky-bg)}
.req .k{font-size:.71rem;font-weight:700;color:var(--sky-tx);text-transform:uppercase;letter-spacing:.03em}
.req .t{font-size:.84rem;margin:4px 0 0}
ul.recs{list-style:none;margin:0;padding:14px;border-radius:9px;border:1px solid var(--warn-br);background:var(--warn-bg)}
ul.recs li{font-size:.85rem;color:var(--warn-tx);margin-bottom:4px}
ul.glist{list-style:none;margin:0;padding:0}
ul.glist li{font-size:.85rem;color:var(--muted);margin-bottom:4px}
ul.glist .tick{color:var(--good-bar);margin-inline-end:6px}
.disc{font-size:.74rem;font-style:italic;color:var(--muted);margin:16px 0 0}
.prov{font-size:.75rem;background:var(--track);color:var(--muted);border-radius:9px;padding:11px;margin-bottom:16px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem}
.cov{font-size:.74rem;margin-top:7px}
.cov.full{color:#6ee7b7}.cov.part{color:#fcd34d}.cov.none{color:#fda4af}
footer{border-top:1px solid var(--border);margin-top:32px;padding:20px 0;text-align:center;color:var(--muted);font-size:.83rem}
.fade{animation:fu .3s ease-out both}
@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
[hidden]{display:none !important}

/* ------------------------------------------------------------------ icons */
.ico{width:1.05em;height:1.05em;flex:0 0 auto;vertical-align:-.16em}
.ico-lg{width:22px;height:22px}
.mark{width:38px;height:38px;flex:0 0 auto}
.mark-sm{width:26px;height:26px;flex:0 0 auto}
/* Each regulator's mark carries its own identity colour. */
.r-RBI{color:var(--rbi)} .r-IRDAI{color:var(--irdai)}
.r-SEBI{color:var(--sebi)} .r-IndiaAI{color:var(--indiaai)}
header.top .mark-sm{color:#fff;opacity:.92}
.brandmarks{display:flex;align-items:center;gap:6px}

/* ---------------------------------------------- plain-language reasons block */
/* Deliberately the visually dominant part of the report: the reader's question
   is "why", and the regulatory apparatus is secondary to answering it. */
.howto{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:12px 14px;
  background:var(--info-bg);border:1px solid var(--info-br);color:var(--info-tx);margin-bottom:16px}
.howto .ico{margin-top:.15em}
.howto .h{font-weight:650;font-size:.85rem;margin-bottom:3px}
.howto .b{font-size:.82rem;line-height:1.5;opacity:.95}

.verdict{border-radius:12px;padding:16px 18px;border:1px solid;margin-bottom:8px}
.verdict .vk{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.verdict .vv{font-size:1.35rem;font-weight:700;margin:4px 0 8px;line-height:1.25}
.verdict .vs{font-size:.92rem;line-height:1.55}
.verdict .vstrong{font-size:.85rem;margin-top:8px;opacity:.9;font-weight:500}

.reason-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
@media(max-width:760px){.reason-cols{grid-template-columns:1fr}}
.rcol h4{display:flex;align-items:center;gap:7px;font-size:.85rem;margin:0 0 8px;font-weight:650}
.rcol.favour h4{color:var(--good-tx)} .rcol.against h4{color:var(--bad-tx)}
.reason{border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:8px;background:var(--panel-2)}
.reason.favour{border-inline-start:3px solid var(--good-bar)}
.reason.against{border-inline-start:3px solid var(--bad-bar)}
.rtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rname{font-size:.88rem;font-weight:650}
.rshare{font-size:.88rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.reason.favour .rshare{color:var(--good-bar)} .reason.against .rshare{color:var(--bad-bar)}
.rbar{height:6px;border-radius:999px;background:var(--track);overflow:hidden;display:flex;margin:7px 0 6px}
.rbar span{height:100%;border-radius:999px}
.reason.favour .rbar span{background:var(--good-bar)} .reason.against .rbar span{background:var(--bad-bar)}
.rsent{font-size:.82rem;line-height:1.5;color:var(--text-2);margin:0}
.rval{font-size:.74rem;color:var(--muted);margin:5px 0 0}
.rnone{font-size:.83rem;color:var(--muted);font-style:italic;padding:8px 0}
.influence{display:flex;gap:8px;align-items:flex-start;font-size:.76rem;color:var(--muted);margin:12px 0 0}

/* A quieter divider before the regulatory half of the report. */
.evidence-split{display:flex;align-items:center;gap:12px;margin:26px 0 4px;
  font-size:.72rem;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.evidence-split:before,.evidence-split:after{content:"";height:1px;background:var(--border);flex:1}

/* report header + attribution block */
.rep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.rep-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.print-btn{white-space:nowrap}
.fmeta{font-size:.78rem;color:var(--muted);margin:0 0 8px}
.factors{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media(max-width:560px){.factors{grid-template-columns:1fr}}
.factor{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border:1px solid var(--border);border-radius:8px;padding:8px 11px;background:var(--track)}
.fname{font-size:.84rem}
.fval{font-size:.84rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fval.pos{color:var(--good-bar)}.fval.neg{color:var(--bad-bar)}

/* Print-only letterhead; hidden on screen. */
.print-head{display:none}

/* ------------------------------------------------------------------ print */
@media print {
  /* Paper is white regardless of the on-screen theme: printing a dark UI
     wastes ink and reads badly. The light tokens are re-declared rather than
     toggling the theme attribute, so the screen is untouched while printing. */
  html, html[data-theme="dark"] {
    --bg:#fff; --panel:#fff; --panel-2:#fff;
    --border:#c9d1dc; --border-strong:#9aa7ba;
    /* --text-2 carries the per-factor explanation sentences, which are the most
       important text in the document. Omitting it left them inheriting the dark
       theme's pale grey onto white paper. */
    --text:#000; --text-2:#1d2739; --muted:#444;
    --accent:#0f766e; --accent-soft:#eef6f5;
    --track:#f2f4f7;
    --good-bg:#f0fdf7; --good-br:#8fdcb6; --good-tx:#065f46; --good-bar:#047857;
    --warn-bg:#fffaf0; --warn-br:#e8c37a; --warn-tx:#7c4a03;
    --bad-bg:#fff5f5;  --bad-br:#e9a3a3;  --bad-tx:#8f1d1d; --bad-bar:#b91c1c;
    --info-bg:#f5f6ff; --info-br:#bcc3ee; --info-tx:#2c2f6b;
    --sky-bg:#f4fafe;  --sky-br:#a8cfe6;  --sky-tx:#0b4f6c;
    --shadow:none;
  }
  @page { size:A4; margin:14mm; }

  body{background:#fff;color:#000;font-size:10.5pt}
  /* Keep the status/finding colours on paper; they carry meaning. */
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .fade{animation:none}

  /* Only the report goes to paper. */
  header.top, footer, #domHeading, #domains, #inputCard, #err, #result,
  .rep-actions, .print-btn { display:none !important; }

  main{padding:0}
  .wrap{max-width:none;padding:0}
  #report{margin:0}
  .card{border:0;box-shadow:none;padding:0;margin:0}

  .print-head{display:block;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
  .ph-title{font-size:15pt;font-weight:700}
  .ph-meta{font-size:8.5pt;color:#333;margin-top:3px}
  /* The on-screen title duplicates the letterhead once printing. */
  .rep-head h2.sec{display:none}

  h3.sub-h{font-size:11pt;margin:14px 0 6px;break-after:avoid;page-break-after:avoid}
  /* Never split an individual finding, requirement, reason or fact. */
  .box, .check, .req, .factor, .prov, ul.recs, .reason, .verdict, .howto
    {break-inside:avoid;page-break-inside:avoid}
  .grid{gap:8px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g2, .factors{grid-template-columns:repeat(2,1fr)}
  /* The reasons are the point of the document, so they keep their two-column
     layout and full weight on paper. */
  .reason-cols{grid-template-columns:1fr 1fr;gap:10px}
  .verdict .vv{font-size:13pt}
  .verdict{padding:10px 12px}
  .reason{background:#fff;padding:8px 10px;margin-bottom:6px}
  .rcol h4{font-size:10pt}
  .evidence-split{margin:18px 0 2px;font-size:8pt}
  .disc{margin-top:14px}
  a[href]:after{content:""}
}
</style>
</head>
<body>
<!--
  Icon sprite. Inline SVG rather than an icon font or emoji: emoji render
  inconsistently across platforms (and were showing as empty boxes on systems
  without an emoji font), carry no semantic meaning, and cannot inherit theme
  colour. These use currentColor and scale cleanly to print.

  The four regulator marks are ORIGINAL, purpose-drawn monograms in each
  regulator's brand-adjacent colour. They are deliberately NOT the official
  RBI / IRDAI / SEBI emblems: those are protected marks, and reproducing them
  in a third-party compliance tool would imply an endorsement or certification
  that does not exist. If this is ever deployed for real, seek written
  permission before using an official emblem.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- domain icons -->
    <symbol id="i-bank" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9.5 12 4l9 5.5"/><path d="M4.5 9.5v9M19.5 9.5v9"/>
      <path d="M8 18.5v-6M12 18.5v-6M16 18.5v-6"/><path d="M2.5 20.5h19"/>
    </symbol>
    <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

<footer><div class="wrap"><p id="footNote"></p><p id="footMeta" style="font-size:.75rem"></p></div></footer>

<script>
/* ---------------------------------------------------------------- helpers */
var API = window.location.origin;
var THEME_KEY = 'xai-theme';

/* Every value interpolated into markup is escaped. Translated strings and
   regulator names are data, and must never be able to inject markup. */
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function pct(n) { return (Number(n) * 100).toFixed(1) + '%'; }
function $(id) { return document.getElementById(id); }

/* Inline SVG from the sprite. Decorative by default: the adjacent text label
   already names the thing, so a duplicate accessible name would just add
   noise for a screen reader. */
function icon(id, cls) {
  return '<svg class="ico ' + (cls || '') + '" aria-hidden="true" focusable="false">' +
    '<use href="#i-' + id + '"></use></svg>';
}
function mark(regulator, cls) {
  return '<svg class="' + (cls || 'mark') + ' r-' + esc(regulator) + '" aria-hidden="true" ' +
    'focusable="false"><use href="#m-' + esc(regulator) + '"></use></svg>';
}

var DOMAIN_ICONS = { credit_scoring:'bank', insurance_underwriting:'shield', healthcare:'health' };
var DOMAIN_ORDER = ['credit_scoring','insurance_underwriting','healthcare'];
var CHOICES = { occupation_risk:['low','medium','high'], treatment_urgency:['routine','moderate','urgent'] };

/* Tone is keyed on the stable decision code, never the translated label, so
   colours stay correct in all 22 languages. */
var TONE = {
  APPROVED:'good', LOW_RISK_ROUTINE:'good', STANDARD_PREMIUM:'good',
  REVIEW_REQUIRED:'warn', MODERATE_RISK_MONITORING:'warn', LOADED_PREMIUM:'warn',
  REJECTED:'bad', DECLINED:'bad', HIGH_RISK_INTERVENTION:'bad'
};
var STATUS_ICON = { PASS:'check', REVIEW:'warn', FAIL:'cross' };

var state = { lang:'hi', catalog:null, ui:{}, domains:null, domainKey:'credit_scoring',
              inputs:{}, result:null, report:null, busy:false, reportBusy:false };

/* ------------------------------------------------------------------ theme */
function applyTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  // Shows the mode you would switch TO, which is the convention users expect.
  $('themeBtn').innerHTML = icon(dark ? 'sun' : 'moon', 'ico-lg');
  $('themeBtn').setAttribute('title', dark ? 'Switch to light theme' : 'Switch to dark theme');
}
function initTheme() {
  var stored = null;
  try { stored = localStorage.getItem(THEME_KEY); } catch (e) {}
  var dark = stored ? stored === 'dark' : true;   // dark by default
  applyTheme(dark);
  return dark;
}
var isDark = initTheme();
$('themeBtn').addEventListener('click', function () {
  isDark = !isDark;
  applyTheme(isDark);
  try { localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light'); } catch (e) {}
});

/* --------------------------------------------------------------- language */
function langMeta() {
  return (state.catalog && state.catalog.languages[state.lang]) || {};
}

/* Direction and lang are set on <html> so the browser applies bidi and the
   correct font stack to the whole document, including the report. */
function applyDirection() {
  var m = langMeta();
  document.documentElement.dir = m.rtl ? 'rtl' : 'ltr';
  document.documentElement.lang = state.lang;
}

function renderLangPicker() {
  var sel = $('langSel');
  if (!state.catalog) { sel.innerHTML = ''; return; }
  var entries = Object.keys(state.catalog.languages).map(function (c) {
    return [c, state.catalog.languages[c]];
  });
  function opt(e) {
    var c = e[0], m = e[1];
    var name = m.name_native + (m.name_native !== m.name_en ? ' (' + m.name_en + ')' : '');
    // Coverage is shown in the picker so an incomplete language is obvious
    // before it is chosen, not after.
    if (m.coverage_percent < 100) name += ' \u2014 ' + m.coverage_percent + '%';
    return '<option value="' + esc(c) + '"' + (c === state.lang ? ' selected' : '') + '>' + esc(name) + '</option>';
  }
  var working = entries.filter(function (e) { return !e[1].scheduled; });
  var sched = entries.filter(function (e) { return e[1].scheduled; })
    .sort(function (a, b) { return a[1].name_en.localeCompare(b[1].name_en); });
  sel.innerHTML =
    '<optgroup label="Working language">' + working.map(opt).join('') + '</optgroup>' +
    '<optgroup label="Eighth Schedule (' + sched.length + ')">' + sched.map(opt).join('') + '</optgroup>';
}

function renderCoverage() {
  var el = $('covBadge'), m = langMeta();
  if (!m.name_native || state.lang === 'en') { el.textContent = ''; el.className = 'cov'; return; }
  var p = m.coverage_percent;
  el.className = 'cov ' + (p >= 90 ? 'full' : p > 0 ? 'part' : 'none');
  el.textContent = p + '% translated' +
    (m.review_status !== 'verified' ? ' \u00B7 awaiting native review' : '');
  el.title = 'Share of the translation key contract covered by this language';
}

/* ---------------------------------------------------------------- domains */
function renderDomains() {
  if (!state.domains) return;
  $('domHeading').textContent = state.ui.select_domain || 'Select Decision Domain';
  $('domains').innerHTML = DOMAIN_ORDER.filter(function (k) { return state.domains[k]; })
    .map(function (k) {
      var d = state.domains[k];
      return '<button class="dcard" data-domain="' + esc(k) + '" aria-pressed="' +
        (state.domainKey === k) + '">' +
        '<div class="dtop">' +
          '<span class="dico r-' + esc(d.regulator) + '">' + icon(DOMAIN_ICONS[k], 'ico-lg') + '</span>' +
          mark(d.regulator, 'mark') +
        '</div>' +
        '<div class="nm">' + esc(d.name) + '</div>' +
        '<div class="rg">' + esc(d.regulator_name) + '</div>' +
        '<span class="tag r-' + esc(d.regulator) + '">' + esc(d.regulator) + '</span></button>';
    }).join('');
}

/* ------------------------------------------------------------- input form */
function renderFields() {
  var d = state.domains && state.domains[state.domainKey];
  if (!d) return;
  var labels = d.field_labels || {};
  $('inputHeading').innerHTML = icon(DOMAIN_ICONS[state.domainKey] || 'doc') +
    ' ' + esc(state.ui.input_params || 'Input Parameters');
  $('sampleBtn').textContent = state.ui.load_sample || 'Load Sample';
  $('langLabel').textContent = state.ui.language_label || 'Explanation Language';
  $('genBtn').textContent = state.busy
    ? (state.ui.generating || 'Generating...')
    : (state.ui.generate_btn || 'Generate Explanation');
  $('genBtn').disabled = state.busy;

  $('fields').innerHTML = Object.keys(state.inputs).map(function (k) {
    var v = state.inputs[k];
    // Field label arrives from the server already translated.
    var head = '<label class="lbl" for="f_' + esc(k) + '">' + esc(labels[k] || k) + '</label>';
    var ctl;
    if (typeof v === 'boolean') {
      ctl = '<select id="f_' + esc(k) + '" data-field="' + esc(k) + '" data-kind="bool">' +
        '<option value="true"' + (v ? ' selected' : '') + '>' + esc(state.ui.yes || 'Yes') + '</option>' +
        '<option value="false"' + (!v ? ' selected' : '') + '>' + esc(state.ui.no || 'No') + '</option></select>';
    } else if (CHOICES[k]) {
      ctl = '<select id="f_' + esc(k) + '" data-field="' + esc(k) + '" data-kind="enum">' +
        CHOICES[k].map(function (o) {
          return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select>';
    } else {
      ctl = '<input id="f_' + esc(k) + '" data-field="' + esc(k) + '" data-kind="num" ' +
        'type="number" step="any" value="' + esc(v) + '">';
    }
    return '<div>' + head + ctl + '</div>';
  }).join('');
}

/* ------------------------------------------------------------ explanation */
function renderResult() {
  var host = $('result'), r = state.result;
  if (!r) { host.innerHTML = ''; return; }
  var lang = r.language, ui = state.ui;
  var tone = TONE[r.decision_code] || 'warn';
  var max = r.feature_contributions.reduce(function (m, c) {
    return Math.max(m, Math.abs(c.contribution));
  }, 1e-9);

  var bars = r.feature_contributions.map(function (c, i) {
    var pos = c.contribution_direction === 'positive';
    // Floor the width so the smallest contributors remain visible.
    var w = Math.max(Math.abs(c.contribution) / max * 100, 2);
    return '<div class="bar-row fade" style="animation-delay:' + (i * 30) + 'ms">' +
      '<div class="bar-head"><span class="bar-name"><span class="bar-rank">#' + c.importance_rank +
      '</span>' + esc(c.feature_label || c.feature_name) + '</span>' +
      '<span class="bar-val ' + (pos ? 'pos' : 'neg') + '">' + (pos ? '+' : '\u2212') +
      (Math.abs(c.contribution) * 100).toFixed(1) + '%</span></div>' +
      '<div class="track"><div class="fill ' + (pos ? 'pos' : 'neg') + '" style="width:' + w + '%"></div></div>' +
      '<p class="bar-exp" lang="' + esc(lang) + '">' + esc(c.translated_explanation) + '</p></div>';
  }).join('');

  // English is kept beside the translation: it is the authoritative text and
  // lets a reviewer who cannot read the script verify the output.
  var showOrig = lang !== 'en' && r.translated_summary !== r.summary_explanation;

  host.innerHTML =
    '<section class="card fade"><h2 class="sec">' + esc(ui.explanation_heading || 'AI Decision & Explanation') + '</h2>' +
      '<div class="grid g4" style="margin-bottom:16px">' +
        '<div class="box tone-' + tone + '"><div class="k">' + esc(ui.decision_label || 'Decision') +
          '</div><div class="v" lang="' + esc(lang) + '">' + esc(r.decision_label) + '</div></div>' +
        '<div class="box"><div class="k">' + esc(ui.confidence_label || 'Confidence') +
          '</div><div class="v">' + pct(r.confidence) + '</div></div>' +
        '<div class="box"><div class="k">' + esc(ui.risk_label || 'Risk Score') +
          '</div><div class="v">' + pct(r.risk_score) + '</div></div>' +
        '<div class="box"><div class="k">' + esc(ui.audit_label || 'Audit ID') +
          '</div><div class="v mono">' + esc(r.audit_id) + '</div></div>' +
      '</div>' +
      '<div class="note"><div class="k">' + esc(ui.summary_heading || 'Explanation Summary') +
        ' \u00B7 ' + esc(r.language_meta.name_native) + '</div>' +
        '<div lang="' + esc(lang) + '" style="font-weight:500">' + esc(r.translated_summary) + '</div>' +
        (showOrig ? '<p class="orig" dir="ltr">' + esc(r.summary_explanation) + '</p>' : '') +
      '</div>' +
      '<div class="warnbar" lang="' + esc(lang) + '">' + icon('scales') + ' ' +
        esc(r.regulatory_compliance.compliance_note) + '</div>' +
    '</section>' +
    '<section class="card fade"><h2 class="sec">' +
      esc(ui.contributions_heading || 'Feature Contributions') + '</h2>' + bars + '</section>' +
    '<div class="center"><button class="btn v" id="reportBtn"' + (state.reportBusy ? ' disabled' : '') + '>' +
      esc(state.reportBusy ? (ui.report_generating || 'Generating report...')
                           : (ui.report_btn || 'Generate Compliance Report')) + '</button></div>';

  $('reportBtn').addEventListener('click', generateReport);
}

/* ----------------------------------------------------------------- report */
/* Rendered entirely from the payload: every heading arrives in report.labels,
   so this function holds no dictionary of its own. */
function renderReport() {
  var host = $('report'), rep = state.report;
  if (!rep) { host.innerHTML = ''; return; }
  var L = rep.labels, lang = rep.language.code, a = rep.compliance_assessment;
  /* Two independent judgements that must never borrow each other's colour:
       complianceTone - was the PROCESS compliant
       decisionTone   - was the OUTCOME favourable to the applicant
     A rejected application assessed by a fully compliant process is green on
     the status pill and red on the verdict. Using one tone for both painted
     "Rejected" in reassuring green. */
  var complianceTone = a.overall_status === 'COMPLIANT' ? 'good' : 'warn';
  var decisionTone = TONE[rep.decision_summary.decision_code] || 'warn';

  var facts = [
    [L.regulator, rep.regulator.name], [L.domain, rep.domain.name],
    [L.report_id, rep.report_id], [L.audit_id, rep.decision_summary.audit_id],
    [L.decision, rep.decision_summary.decision], [L.confidence, pct(rep.decision_summary.confidence)],
    [L.risk_score, pct(rep.decision_summary.risk_score)], [L.model_version, rep.model_info.version]
  ].map(function (p) {
    return '<div class="box"><div class="k">' + esc(p[0]) + '</div><div class="v">' + esc(p[1]) + '</div></div>';
  }).join('');

  // Citations keep their published English form, so they are forced LTR.
  var guides = rep.regulator.applicable_guidelines.map(function (g) {
    return '<li><span class="tick">' + icon('check') + '</span><span dir="ltr">' + esc(g) + '</span></li>';
  }).join('');

  var checks = a.detailed_checks.map(function (c) {
    return '<div class="check st-' + esc(c.status) + '">' +
      '<div class="top"><span>' + (STATUS_ICON[c.status] || '') + '</span>' +
      '<span>' + esc(c.check_name) + '</span>' +
      '<span class="st">' + esc(c.status_label) + '</span></div>' +
      '<p class="crit">' + esc(c.criterion) + '</p>' +
      // Findings stay English: they name specific evidence for the officer.
      (c.finding ? '<p class="find" dir="ltr">' + esc(c.finding) + '</p>' : '') +
      '</div>';
  }).join('');

  var reqs = rep.requirements_met.map(function (q) {
    return '<div class="req"><div class="k">' + esc(q.label) + '</div>' +
      '<p class="t">' + esc(q.text) + '</p></div>';
  }).join('');

  var recs = rep.recommendations.map(function (x) {
    return '<li>\u2022 ' + esc(x) + '</li>';
  }).join('');

  /* The feature attribution is the evidence the whole report rests on, so it
     belongs in the report itself rather than only in the interactive panel
     above - otherwise a printed or filed report omits its own basis. The
     payload has always carried this; it simply was not being rendered. */
  var er = rep.explainability_report || {};
  var RL = rep.reason_labels || {};
  var rz = rep.reasoning || {};

  /* One reason: name, share of influence, a proportional bar, the full
     sentence, and the value actually submitted. Everything a reader needs to
     check the decision against their own paperwork. */
  function reasonCard(f) {
    var side = f.direction === 'positive' ? 'favour' : 'against';
    var share = (f.share * 100).toFixed(1);
    return '<div class="reason ' + side + '">' +
      '<div class="rtop"><span class="rname">' + esc(f.feature) + '</span>' +
      '<span class="rshare">' + share + '%</span></div>' +
      '<div class="rbar"><span style="width:' + Math.max(f.share * 100, 1.5) + '%"></span></div>' +
      '<p class="rsent">' + esc(f.explanation) + '</p>' +
      '<p class="rval">' + esc(RL.value_label || 'Value used') + ': ' + esc(fmtVal(f.value)) + '</p>' +
      '</div>';
  }
  function column(side, list, heading, emptyMsg, iconId) {
    return '<div class="rcol ' + side + '">' +
      '<h4>' + icon(iconId) + esc(heading) + '</h4>' +
      (list && list.length ? list.map(reasonCard).join('')
                           : '<p class="rnone">' + esc(emptyMsg) + '</p>') +
      '</div>';
  }

  var reasonsBlock = (rz.favour || rz.against)
    ? '<div class="howto">' + icon('info') +
        '<div><div class="h">' + esc(RL.how_to_read || '') + '</div>' +
        '<div class="b">' + esc(RL.how_to_read_body || '') + '</div></div></div>' +
      '<div class="verdict tone-' + decisionTone + '">' +
        '<div class="vk">' + esc(RL.plain_verdict || 'In plain language') + '</div>' +
        '<div class="vv">' + esc(rep.decision_summary.decision) + '</div>' +
        (rz.plain_summary ? '<div class="vs">' + esc(rz.plain_summary) + '</div>' : '') +
        (rz.strongest ? '<div class="vstrong">' + esc(rz.strongest) + '</div>' : '') +
      '</div>' +
      '<h3 class="sub-h">' + esc(RL.reasons_heading || '') + '</h3>' +
      '<div class="reason-cols">' +
        column('against', rz.against, RL.against_heading || '', RL.no_against || '', 'down') +
        column('favour', rz.favour, RL.favour_heading || '', RL.no_favour || '', 'up') +
      '</div>' +
      '<p class="influence">' + icon('info') + '<span>' + esc(RL.influence_note || '') + '</span></p>'
    : '';

  var factors = (er.top_factors || []).map(function (f) {
    var pos = f.direction === 'positive';
    return '<div class="factor">' +
      '<span class="fname">' + esc(f.feature) + '</span>' +
      '<span class="fval ' + (pos ? 'pos' : 'neg') + '">' + (pos ? '+' : '\u2212') +
      (Math.abs(f.contribution) * 100).toFixed(1) + '%</span></div>';
  }).join('');

  host.innerHTML = '<section class="card fade" id="reportCard" lang="' + esc(lang) + '">' +
    /* Print-only letterhead. Browser print headers are unreliable and often
       disabled, so identity travels inside the document. */
    '<div class="print-head">' +
      '<div class="ph-title">' + esc(L.title) + '</div>' +
      '<div class="ph-meta">' + esc(L.report_id) + ': ' + esc(rep.report_id) +
        '  \u00B7  ' + esc(L.audit_id) + ': ' + esc(rep.decision_summary.audit_id) +
        '  \u00B7  ' + esc(L.generated_at) + ': ' + esc(fmtStamp(rep.generated_at)) + '</div>' +
      '<div class="ph-meta" dir="ltr">' + esc(location.origin) + '</div>' +
    '</div>' +
    '<div class="rep-head">' +
      '<h2 class="sec" style="margin:0">' + esc(L.title) + '</h2>' +
      '<div class="rep-actions">' +
        '<span class="pill tone-' + complianceTone + '">' + esc(a.overall_status_label) + '</span>' +
        '<button class="btn ghost print-btn" id="printBtn" type="button">' +
          icon('print') + ' ' + esc(state.ui.print_btn || 'Print report') + '</button>' +
      '</div>' +
    '</div>' +
    (rep.translation_notice ? '<p class="prov">' + esc(rep.translation_notice) + '</p>' : '') +
    /* Reading order is intentional: what was decided and why, in plain
       language, BEFORE the regulatory apparatus. A reader who stops after the
       first screen should already have their answer. */
    reasonsBlock +
    '<div class="evidence-split">' + esc(L.explainability_heading || 'Evidence') + '</div>' +
    '<div class="grid g4">' + facts + '</div>' +
    (factors
      ? '<h3 class="sub-h">' + esc(L.top_factors) + '</h3>' +
        '<p class="fmeta">' + esc(L.features_explained) + ': ' + esc(er.num_features_explained) + '</p>' +
        '<div class="factors">' + factors + '</div>'
      : '') +
    '<h3 class="sub-h">' + esc(L.guidelines_heading) + '</h3><ul class="glist">' + guides + '</ul>' +
    '<h3 class="sub-h">' + esc(L.checks_heading) + ' <span class="muted" style="font-weight:400">(' +
      a.checks_passed + '/' + a.checks_total + ')</span></h3>' +
    '<div class="grid g2">' + checks + '</div>' +
    '<h3 class="sub-h">' + esc(L.requirements_heading) + '</h3><div class="grid g2">' + reqs + '</div>' +
    '<h3 class="sub-h">' + esc(L.recommendations_heading) + '</h3><ul class="recs">' + recs + '</ul>' +
    '<p class="disc">' + esc(rep.legal_disclaimer) + '</p></section>';

  $('printBtn').addEventListener('click', printReport);
}

/* Submitted values are shown back to the reader so they can check the decision
   against their own paperwork. Booleans were coerced to 1/0 upstream, so they
   are restored to words; large amounts get thousands separators. */
function fmtVal(v) {
  if (v === 1 || v === 0) {
    // Only genuine flags are 0/1 after normalisation; counts of 0 or 1 read
    // fine as digits either way, so prefer the digit to avoid guessing wrong.
    return String(v);
  }
  if (typeof v === 'number' && isFinite(v)) {
    return Number.isInteger(v) ? v.toLocaleString() : String(v);
  }
  return String(v == null ? '' : v);
}

/* ISO timestamp -> locale string, falling back to the raw value so a printed
   report never shows "Invalid Date". */
function fmtStamp(iso) {
  var d = new Date(iso);
  return isNaN(d.getTime()) ? String(iso || '') : d.toLocaleString();
}

/* Printing is driven entirely by the print stylesheet, which hides the app
   chrome and reflows the report onto paper. No second window is opened: a
   popup would be blocked by default and would lose the loaded fonts. */
function printReport() {
  if (!state.report) return;
  document.body.classList.add('printing');
  window.print();
}
/* Clean up whether the dialog was completed or cancelled. */
window.addEventListener('afterprint', function () {
  document.body.classList.remove('printing');
});

function renderChrome() {
  $('appTitle').textContent = state.ui.app_title || 'XAI Platform';
  var sub = $('appSub');
  sub.textContent = state.ui.app_subtitle || '';
  sub.setAttribute('lang', state.lang);
  var fn = $('footNote');
  fn.textContent = state.ui.footer_note || '';
  fn.setAttribute('lang', state.lang);
  if (state.catalog) {
    $('footMeta').textContent = state.catalog.scheduled_languages +
      ' Eighth Schedule catalogs \u00B7 ' + state.catalog.contract_keys + ' translation keys';
  }
  renderCoverage();
}

function renderAll() {
  applyDirection();
  renderChrome();
  renderDomains();
  renderFields();
  renderResult();
  renderReport();
}

function showError(msg) {
  var el = $('err');
  if (!msg) { el.hidden = true; el.textContent = ''; return; }
  el.hidden = false;
  el.textContent = msg;
}

/* ------------------------------------------------------------------ data */
function getJSON(path) {
  return fetch(API + path).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status + ' on ' + path);
    return res.json();
  });
}
function postJSON(path, body) {
  return fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (res) {
    return res.json().then(function (data) {
      if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
      return data;
    });
  });
}

/* UI strings, domain names and field labels are all language-dependent, so a
   language change refetches them rather than translating on the client. */
function loadLanguage(keepInputs) {
  return Promise.all([
    getJSON('/api/i18n/ui?lang=' + encodeURIComponent(state.lang)),
    getJSON('/api/models/domains?lang=' + encodeURIComponent(state.lang))
  ]).then(function (out) {
    state.ui = out[0].strings || {};
    state.domains = out[1];
    if (!keepInputs || !Object.keys(state.inputs).length) {
      state.inputs = Object.assign({}, state.domains[state.domainKey].sample_input);
    }
    renderAll();
  });
}

function boot() {
  getJSON('/api/i18n/languages').then(function (cat) {
    state.catalog = cat;
    if (!cat.languages[state.lang]) state.lang = 'en';
    renderLangPicker();
    return loadLanguage(false);
  }).catch(function (e) {
    showError('Could not reach the API (' + e.message + '). Start the server with: python server.py');
  });
}

/* ---------------------------------------------------------------- actions */
function generate() {
  state.busy = true; state.result = null; state.report = null;
  showError(null); renderFields(); renderResult(); renderReport();

  postJSON('/api/explanations/generate', {
    domain: state.domainKey,
    language: state.lang,
    regulator: state.domains[state.domainKey].regulator,
    input_data: state.inputs,
    model_version: 'v1.0'
  }).then(function (data) {
    state.result = data;
  }).catch(function (e) {
    showError(e.message);
  }).then(function () {
    state.busy = false;
    renderFields(); renderResult();
  });
}

function generateReport() {
  if (!state.result) return;
  state.reportBusy = true; state.report = null;
  renderResult(); renderReport();

  postJSON('/api/reports/generate', {
    explanation_id: state.result.audit_id,
    domain: state.domainKey,
    regulator: state.domains[state.domainKey].regulator,
    language: state.lang
  }).then(function (data) {
    state.report = data;
  }).catch(function (e) {
    showError(e.message);
  }).then(function () {
    state.reportBusy = false;
    renderResult(); renderReport();
  });
}

/* ------------------------------------------------------------------ events */
/* Delegated, because the fields and domain cards are re-rendered on every
   language change and would otherwise lose their listeners. */
$('domains').addEventListener('click', function (ev) {
  var btn = ev.target.closest('[data-domain]');
  if (!btn) return;
  state.domainKey = btn.getAttribute('data-domain');
  state.inputs = Object.assign({}, state.domains[state.domainKey].sample_input);
  state.result = null; state.report = null;
  showError(null); renderAll();
});

$('fields').addEventListener('input', function (ev) {
  var el = ev.target, field = el.getAttribute('data-field');
  if (!field) return;
  var kind = el.getAttribute('data-kind');
  if (kind === 'bool') state.inputs[field] = el.value === 'true';
  else if (kind === 'num') state.inputs[field] = el.value === '' ? 0 : parseFloat(el.value);
  else state.inputs[field] = el.value;
});
$('sampleBtn').addEventListener('click', function () {
  state.inputs = Object.assign({}, state.domains[state.domainKey].sample_input);
  renderFields();
});

$('genBtn').addEventListener('click', generate);

$('langSel').addEventListener('change', function () {
  state.lang = this.value;
  renderCoverage();
  // Existing output was produced in the previous language; clear it rather
  // than showing a mixed-language screen.
  state.result = null; state.report = null;
  loadLanguage(true).catch(function (e) { showError(e.message); });
});

boot();
</script>
</body>
</html>
