<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAI Platform - Explainable AI for Regulated Industries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 50%, #7c3aed 100%); }
        .card-hover { transition: all 0.3s; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.12); }
        .bar-positive { background: linear-gradient(90deg, #10b981, #34d399); }
        .bar-negative { background: linear-gradient(90deg, #ef4444, #f87171); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease-out; }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div id="root"></div>
    <script type="text/babel">
const { useState } = React;
const API = window.location.origin;

const LANGUAGES = { en:"English", hi:"हिन्दी (Hindi)", bn:"বাংলা (Bengali)", ta:"தமிழ் (Tamil)", te:"తెలుగు (Telugu)", mr:"मराठी (Marathi)", gu:"ગુજરાતી (Gujarati)", kn:"ಕನ್ನಡ (Kannada)", ml:"മലയാളം (Malayalam)", pa:"ਪੰਜਾਬੀ (Punjabi)", ur:"اردو (Urdu)" };

const DOMAINS = {
    credit_scoring: { name:"Credit Scoring", regulator:"RBI", icon:"🏦", desc:"AI-based credit risk assessment for loan applications", sample: { annual_income:800000, credit_history_months:60, existing_loans:2, loan_amount_requested:500000, employment_years:5, monthly_expenses:35000, age:32, defaults_in_past:0 }},
    insurance_underwriting: { name:"Insurance Underwriting", regulator:"IRDAI", icon:"🛡️", desc:"AI-driven insurance risk assessment and premium calculation", sample: { age:45, bmi:26.5, smoking_status:false, pre_existing_conditions:1, family_history_score:0.3, occupation_risk:"medium", coverage_amount:5000000 }},
    healthcare: { name:"Healthcare Risk", regulator:"IndiaAI", icon:"🏥", desc:"AI-powered patient risk stratification", sample: { age:55, symptoms_severity:6.5, lab_results_abnormal:3, medical_history_score:0.4, vitals_risk_score:0.5, treatment_urgency:"moderate" }},
};

function App() {
    const [domain, setDomain] = useState('credit_scoring');
    const [language, setLanguage] = useState('hi');
    const [inputs, setInputs] = useState({...DOMAINS.credit_scoring.sample});
    const [result, setResult] = useState(null);
    const [report, setReport] = useState(null);
    const [loading, setLoading] = useState(false);
    const [rptLoading, setRptLoading] = useState(false);

    const changeDomain = (d) => { setDomain(d); setInputs({...DOMAINS[d].sample}); setResult(null); setReport(null); };

    const generate = async () => {
        setLoading(true); setResult(null); setReport(null);
        try {
            const res = await fetch(`${API}/api/explanations/generate`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ domain, language, regulator: DOMAINS[domain].regulator, input_data: inputs }) });
            setResult(await res.json());
        } catch(e) { alert('Error: '+e.message); }
        setLoading(false);
    };

    const genReport = async (auditId) => {
        setRptLoading(true); setReport(null);
        try {
            const res = await fetch(`${API}/api/reports/generate`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ explanation_id: auditId, domain, regulator: DOMAINS[domain].regulator, language }) });
            setReport(await res.json());
        } catch(e) { alert('Error: '+e.message); }
        setRptLoading(false);
    };

    return (
    <div className="min-h-screen bg-gray-50">
        {/* Header */}
        <header className="gradient-bg text-white shadow-xl">
            <div className="max-w-7xl mx-auto px-4 py-6 flex items-center justify-between">
                <div>
                    <h1 className="text-3xl font-bold">🔍 XAI Platform</h1>
                    <p className="text-blue-100 text-sm mt-1">Multilingual Explainable AI for Regulated Industries</p>
                </div>
                <div className="flex gap-2">
                    {['RBI','IRDAI','SEBI','IndiaAI'].map(r=><span key={r} className="bg-white/20 rounded px-2 py-1 text-xs">{r}</span>)}
                </div>
            </div>
        </header>

        <main className="max-w-7xl mx-auto px-4 py-8">
            {/* Domain Cards */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                {Object.entries(DOMAINS).map(([k,d])=>(
                    <div key={k} onClick={()=>changeDomain(k)} className={`card-hover cursor-pointer rounded-xl p-5 border-2 ${domain===k?'border-blue-500 bg-blue-50 shadow-lg':'border-gray-200 bg-white hover:border-blue-300'}`}>
                        <div className="text-3xl mb-2">{d.icon}</div>
                        <h3 className="font-semibold text-gray-800">{d.name}</h3>
                        <p className="text-sm text-gray-500 mt-1">{d.desc}</p>
                        <span className="mt-3 inline-block bg-blue-100 text-blue-800 text-xs font-medium px-2 py-0.5 rounded">{d.regulator}</span>
                    </div>
                ))}
            </div>

            {/* Input Form */}
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
                <div className="flex items-center justify-between mb-4">
                    <h3 className="text-lg font-semibold">{DOMAINS[domain].icon} Input Parameters</h3>
                    <button onClick={()=>setInputs({...DOMAINS[domain].sample})} className="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg">Load Sample</button>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                    {Object.entries(inputs).map(([k,v])=>(
                        <div key={k}>
                            <label className="text-xs font-medium text-gray-600 block mb-1">{k.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}</label>
                            {typeof v==='boolean'?
                                <select value={v.toString()} onChange={e=>setInputs(p=>({...p,[k]:e.target.value==='true'}))} className="w-full border rounded-lg px-3 py-2 text-sm"><option value="true">Yes</option><option value="false">No</option></select>
                            : typeof v==='string'?
                                <select value={v} onChange={e=>setInputs(p=>({...p,[k]:e.target.value}))} className="w-full border rounded-lg px-3 py-2 text-sm">
                                    {k==='occupation_risk'&&['low','medium','high'].map(o=><option key={o}>{o}</option>)}
                                    {k==='treatment_urgency'&&['routine','moderate','urgent'].map(o=><option key={o}>{o}</option>)}
                                </select>
                            : <input type="number" value={v} onChange={e=>setInputs(p=>({...p,[k]:parseFloat(e.target.value)||0}))} className="w-full border rounded-lg px-3 py-2 text-sm"/>
                            }
                        </div>
                    ))}
                </div>
                <div className="flex items-end gap-4 border-t pt-4">
                    <div className="flex-1">
                        <label className="text-xs font-medium text-gray-600 block mb-1">Explanation Language</label>
                        <select value={language} onChange={e=>setLanguage(e.target.value)} className="w-full border rounded-lg px-3 py-2 text-sm">
                            {Object.entries(LANGUAGES).map(([c,n])=><option key={c} value={c}>{n}</option>)}
                        </select>
                    </div>
                    <button onClick={generate} disabled={loading} className="flex-1 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-medium py-2.5 px-6 rounded-lg">
                        {loading?'⏳ Generating...':'🔍 Generate Explanation'}
                    </button>
                </div>
            </div>

            {/* Results */}
            {result && !result.error && (
            <div className="fade-in space-y-4">
                {/* Decision */}
                <div className="bg-white rounded-xl shadow-sm border p-6">
                    <h3 className="text-lg font-semibold mb-4">📊 AI Decision & Explanation</h3>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                        <div className={`rounded-lg p-3 border ${result.decision.includes('APPROVED')||result.decision.includes('LOW_RISK')||result.decision.includes('STANDARD')?'bg-green-50 border-green-200 text-green-800':result.decision.includes('REVIEW')||result.decision.includes('MODERATE')||result.decision.includes('LOADED')?'bg-yellow-50 border-yellow-200 text-yellow-800':'bg-red-50 border-red-200 text-red-800'}`}>
                            <p className="text-xs opacity-75">Decision</p>
                            <p className="font-bold">{result.decision.replace(/_/g,' ')}</p>
                        </div>
                        <div className="rounded-lg p-3 bg-blue-50 border border-blue-200">
                            <p className="text-xs text-blue-600">Confidence</p>
                            <p className="font-bold text-blue-800">{(result.confidence*100).toFixed(1)}%</p>
                        </div>
                        <div className="rounded-lg p-3 bg-purple-50 border border-purple-200">
                            <p className="text-xs text-purple-600">Risk Score</p>
                            <p className="font-bold text-purple-800">{(result.risk_score*100).toFixed(1)}%</p>
                        </div>
                        <div className="rounded-lg p-3 bg-gray-50 border">
                            <p className="text-xs text-gray-600">Audit ID</p>
                            <p className="font-bold text-xs mt-1">{result.audit_id}</p>
                        </div>
                    </div>

                    <div className="bg-indigo-50 border border-indigo-200 rounded-lg p-4 mb-4">
                        <p className="text-sm font-medium text-indigo-700 mb-1">📝 Explanation ({LANGUAGES[result.language]||result.language})</p>
                        <p className="text-indigo-900 font-medium">{result.translated_summary}</p>
                        {result.language!=='en'&&<p className="text-indigo-600 text-sm mt-2 italic">{result.summary_explanation}</p>}
                    </div>

                    <div className="bg-amber-50 border border-amber-200 rounded-lg p-3">
                        <p className="text-sm text-amber-800">⚖️ {result.regulatory_compliance.compliance_note}</p>
                    </div>
                </div>

                {/* Feature Chart */}
                <div className="bg-white rounded-xl shadow-sm border p-6">
                    <h3 className="text-lg font-semibold mb-4">📈 Feature Contributions (SHAP-like Analysis)</h3>
                    <div className="space-y-3">
                        {result.feature_contributions.map((c,i)=>{
                            const maxAbs = Math.max(...result.feature_contributions.map(x=>Math.abs(x.contribution)));
                            const w = Math.abs(c.contribution)/maxAbs*100;
                            const pos = c.contribution_direction==='positive';
                            return (
                            <div key={i}>
                                <div className="flex justify-between mb-1">
                                    <span className="text-sm font-medium text-gray-700">#{c.importance_rank} {c.feature_name.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}</span>
                                    <span className={`text-sm font-bold ${pos?'text-green-600':'text-red-600'}`}>{pos?'+':''}{(c.contribution*100).toFixed(1)}%</span>
                                </div>
                                <div className="w-full bg-gray-100 rounded-full h-3">
                                    <div className={`h-3 rounded-full ${pos?'bar-positive':'bar-negative'}`} style={{width:`${w}%`,transition:'width 0.7s'}}></div>
                                </div>
                                <p className="text-xs text-gray-500 mt-0.5">{c.translated_explanation}</p>
                            </div>);
                        })}
                    </div>
                </div>

                {/* Report Button */}
                <div className="flex justify-center">
                    <button onClick={()=>genReport(result.audit_id)} disabled={rptLoading} className="bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 px-8 rounded-lg shadow">
                        {rptLoading?'⏳ Generating...':'📋 Generate Regulatory Compliance Report'}
                    </button>
                </div>

                {/* Report */}
                {report && !report.error && (
                <div className="fade-in bg-white rounded-xl shadow-sm border p-6">
                    <div className="flex items-center justify-between mb-5">
                        <h3 className="text-lg font-semibold">📋 Regulatory Compliance Report</h3>
                        <span className={`px-3 py-1 rounded-full border text-sm font-bold ${report.compliance_assessment.overall_status==='COMPLIANT'?'text-green-700 bg-green-100 border-green-300':'text-yellow-700 bg-yellow-100 border-yellow-300'}`}>
                            {report.compliance_assessment.overall_status}
                        </span>
                    </div>

                    <div className="bg-gray-50 rounded-lg p-4 mb-4 grid grid-cols-2 gap-4">
                        <div><p className="text-xs text-gray-500">Regulator</p><p className="font-semibold">{report.regulator.name}</p></div>
                        <div><p className="text-xs text-gray-500">Report ID</p><p className="font-mono text-sm">{report.report_id}</p></div>
                        <div><p className="text-xs text-gray-500">Generated</p><p className="text-sm">{new Date(report.generated_at).toLocaleString()}</p></div>
                        <div><p className="text-xs text-gray-500">Audit ID</p><p className="font-mono text-sm">{report.decision_summary.audit_id}</p></div>
                    </div>

                    <div className="mb-4">
                        <h4 className="text-sm font-semibold text-gray-700 mb-2">📜 Applicable Guidelines</h4>
                        <ul className="space-y-1">{report.regulator.applicable_guidelines.map((g,i)=><li key={i} className="text-sm text-gray-600">✓ {g}</li>)}</ul>
                    </div>

                    <div className="mb-4">
                        <h4 className="text-sm font-semibold text-gray-700 mb-2">✅ Compliance Checks ({report.compliance_assessment.checks_passed}/{report.compliance_assessment.checks_total})</h4>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                            {report.compliance_assessment.detailed_checks.map((ch,i)=>(
                                <div key={i} className="rounded-lg p-3 border bg-green-50 border-green-200">
                                    <div className="flex items-center gap-2"><span>✅</span><span className="text-sm font-medium">{ch.check_name}</span></div>
                                    <p className="text-xs text-gray-600 mt-1 ml-6">{ch.details}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="mb-4">
                        <h4 className="text-sm font-semibold text-gray-700 mb-2">📋 Requirements</h4>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                            {Object.entries(report.requirements_met).map(([k,v])=>(
                                <div key={k} className="bg-blue-50 border border-blue-200 rounded-lg p-3">
                                    <p className="text-xs font-semibold text-blue-700">{k.replace(/_/g,' ').toUpperCase()}</p>
                                    <p className="text-sm text-blue-900 mt-1">{v}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="bg-amber-50 border border-amber-200 rounded-lg p-4">
                        <h4 className="text-sm font-semibold text-amber-800 mb-2">💡 Recommendations</h4>
                        <ul>{report.recommendations.map((r,i)=><li key={i} className="text-sm text-amber-700">• {r}</li>)}</ul>
                    </div>
                    <p className="text-xs text-gray-400 mt-4 italic">{report.legal_disclaimer}</p>
                </div>)}
            </div>)}
        </main>

        <footer className="bg-gray-800 text-gray-300 py-6 mt-12">
            <div className="max-w-7xl mx-auto px-4 text-center">
                <p className="text-sm">XAI Platform v1.0 | Compliant with RBI, IRDAI, SEBI & IndiaAI Guidelines</p>
                <p className="text-xs text-gray-500 mt-1">Supporting 22 Scheduled Indian Languages | Audit-Ready Explanations</p>
            </div>
        </footer>
    </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
